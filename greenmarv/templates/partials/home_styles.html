    /* ============================================ */
    /* LIFESTYLE GALLERY — self-contained, mg- prefix */
    /* ============================================ */
    
    lifestyle-gallery {
        padding: 5rem 5%;
        background: white;
    }
 
    .mg-gallery-grid {
        max-width: 1400px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.25rem;
    }
 
    .mg-gallery-item {
        position: relative;
        aspect-ratio: 4 / 5;
        border-radius: 20px;
        overflow: hidden;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.4s;
        /* Soft fallback background while image loads — prevents blank cards */
        background: linear-gradient(135deg, #f8fdf8, #e8f5e9);
    }
 
    .mg-gallery-item:hover {
        transform: translateY(-6px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }
 
    /* CRITICAL: img must fill cell like background-image did */
    .mg-gallery-image {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;            /* same effect as background-size: cover */
        object-position: center;      /* same as background-position: center */
        transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        /* Subtle fade-in once image loads */
        opacity: 0;
        animation: imgFadeIn 0.5s ease forwards;
    }
 
    @keyframes imgFadeIn {
        to { opacity: 1; }
    }
 
    .mg-gallery-item:hover .mg-gallery-image {
        transform: scale(1.08);
    }
 
    /* Permanent soft gradient overlay */
    .mg-gallery-item::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(
            to top,
            rgba(27, 48, 34, 0.4) 0%,
            rgba(27, 48, 34, 0.1) 40%,
            transparent 70%
        );
        pointer-events: none;
        transition: opacity 0.4s ease;
        z-index: 1;
    }
 
    .mg-gallery-overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(
            to top,
            rgba(27, 48, 34, 0.92) 0%,
            rgba(27, 48, 34, 0.6) 40%,
            rgba(197, 160, 89, 0.1) 100%
        );
        display: flex;
        align-items: flex-end;
        padding: 1.75rem;
        opacity: 0;
        transition: opacity 0.4s ease;
        z-index: 2;
    }
 
    .mg-gallery-item:hover .mg-gallery-overlay {
        opacity: 1;
    }
 
    .mg-gallery-content h3 {
        color: #c5a059;
        font-size: 1.4rem;
        font-style: italic;
        font-weight: 700;
        margin-bottom: 0.35rem;
        letter-spacing: -0.3px;
        transform: translateY(10px);
        transition: transform 0.4s ease 0.05s;
    }
 
    .mg-gallery-content p {
        color: #fcf8ef;
        font-size: 0.9rem;
        font-weight: 500;
        opacity: 0.95;
        transform: translateY(10px);
        transition: transform 0.4s ease 0.1s;
    }
 
    .mg-gallery-item:hover .mg-gallery-content h3,
    .mg-gallery-item:hover .mg-gallery-content p {
        transform: translateY(0);
    }
 
    /* Responsive */
    @media (max-width: 992px) {
        .mg-gallery-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }

            grid-template-columns: 1fr;
            gap: 1rem;
        }
        .mg-gallery-item {
            aspect-ratio: 4 / 3;
        }
    }
