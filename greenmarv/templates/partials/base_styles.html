
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            overflow-x: hidden;
        }

        /* Header */
        header {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 1.2rem 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        header.scrolled {
            padding: 0.8rem 5%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }


        .search-icon, .cart-icon {
            cursor: pointer;
            font-size: 1.3rem;
            color: #1a1a1a;
            transition: transform 0.3s, color 0.3s;
            position: relative;
        }

        .search-icon:hover, .cart-icon:hover {
            transform: scale(1.1);
            color: #4CAF50;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -10px;
            background: #e74c3c;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: bold;
        }

        /* Announcement Bar */
        .announcement {
            background: linear-gradient(135deg, #2d5016, #4CAF50);
            color: #c5a059;
            text-align: center;
            padding: 0.8rem;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

.hero {
    position: relative;
    height: 90vh;
    /* Gradient inspired by the Vitality gold and brand green */
    background: linear-gradient(135deg, #1b3022 0%, #2d5016 40%, #c5a059 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 8%;
    overflow: hidden;
    color: white;
    animation: fadeIn 1s ease;
}

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }   

/* Adding a subtle shimmer overlay to the background */
.hero::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="white" fill-opacity="0.03" width="100" height="100"/></svg>');
    pointer-events: none;
}

.hero-container {
    display: flex;
    align-items: center;
    width: 100%;
    max-width: 1600px;
    gap: 4rem;
    z-index: 2;
}


.hero-content h1 {
    font-size: 4.5rem;
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 1.5rem;
    /* Subtle gold tint to the heading */
    color: #fcf8ef; 
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
}

/* Buttons adjusted for the new palette */
.btn-primary {
    background: #1b3022; /* Dark forest green */
    color: #fcf8ef;
    border: 1px solid #c5a059;
    transition: transform 0.3s, box-shadow 0.3s;
    animation: fadeIn 1s ease 0.6s backwards;
}

.btn-primary:hover {
    background: #c5a059;
    color: #1b3022;
    box-shadow: 0 10px 20px rgba(197, 160, 89, 0.3);
}

.btn-secondary {
    border: 2px solid #fcf8ef;
    color: #fcf8ef;
    transition: transform 0.3s, box-shadow 0.3s;
    animation: fadeIn 1s ease 0.6s backwards;
}


.spill-blob, .drip {
    background: #ffffff;
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
}



.spill-wrapper {
    position: relative;
    filter: url('#goo');
    display: flex;
    justify-content: center;
    align-items: center;
}

.spill-blob {
    position: absolute;
    width: 200px;
    height: 180px;
    background: #c5a059; 
    border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
    top: 25%;
    right: 15%;
    z-index: 1;
    animation: flow-blob 8s ease-in-out infinite;
    box-shadow: 0 0 20px rgba(255,255,255,0.4);
}

.drip {
    position: absolute;
    background: #ffffff;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    top: 45%;
    right: 25%;
    z-index: 1;
    animation: drip-fall 4s infinite cubic-bezier(0.5, 0, 0.5, 1);
} 

.product-hero-img {
    width: 100%;
    max-width: 500px;
    z-index: 5;
    position: relative;
    filter: drop-shadow(0 20px 40px rgba(0,0,0,0.2));
}

/* Animations */
@keyframes flow-blob {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.15) rotate(8deg); }
}

@keyframes drip-fall {
    0% { transform: translateY(0) scale(1); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(300px) scale(0.3); opacity: 0; }
}

/* Floating Leaves Styling */
.leaf-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; /* Allows clicks to pass through to buttons */
    z-index: 1;
}

.floating-leaf {
    position: absolute;
    font-size: 2rem;
    opacity: 0.6;
    filter: blur(0.5px);
    animation: float-around 10s ease-in-out infinite;
}

/* Individual leaf placements and timing */
.leaf-1 { top: 20%; right: 10%; animation-duration: 8s; font-size: 2.5rem; }
.leaf-2 { top: 70%; right: 40%; animation-delay: -2s; animation-duration: 12s; }
.leaf-3 { top: 40%; right: 5%; animation-delay: -5s; animation-duration: 9s; opacity: 0.4; }
.leaf-4 { top: 10%; right: 45%; animation-delay: -1s; animation-duration: 11s; filter: blur(2px); }

.leaf-3 { top: 30%; right: 20%; animation-duration: 8s; font-size: 2.5rem; }
.leaf-4 { top: 80%; right: 50%; animation-delay: -2s; animation-duration: 12s; }
.leaf-5 { top: 50%; right: 10%; animation-delay: -5s; animation-duration: 9s; opacity: 0.4; }
.leaf-6 { top: 15%; right: 60%; animation-delay: -1s; animation-duration: 11s; filter: blur(2px); }

/* The floating and rotating motion */
@keyframes float-around {
    0%, 100% {
        transform: translate(0, 0) rotate(0deg);
    }
    33% {
        transform: translate(20px, -30px) rotate(15deg);
    }
    66% {
        transform: translate(-15px, 20px) rotate(-10deg);
    }
}
        
 /* ============================================ */
    /* MARVELOUSLY GREEN — TOAST NOTIFICATIONS       */
    /* ============================================ */
    .mg-toast-container {
        position: fixed;
        top: 1.5rem;
        right: 1.5rem;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        max-width: 420px;
        width: calc(100% - 3rem);
        pointer-events: none;  /* container is just for positioning; toasts handle clicks */
    }
 
    .mg-toast {
        position: relative;
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 0.85rem;
        align-items: flex-start;
        padding: 1rem 1.1rem;
        background: white;
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        border-left: 4px solid;
        animation: mgToastSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        overflow: hidden;
        pointer-events: auto;  /* re-enable clicks on actual toast */
    }
 
    .mg-toast.mg-toast-dismissing {
        animation: mgToastSlideOut 0.3s cubic-bezier(0.4, 0, 1, 1) forwards;
    }
 
    @keyframes mgToastSlideIn {
        from {
            opacity: 0;
            transform: translateX(100%) scale(0.95);
        }
        to {
            opacity: 1;
            transform: translateX(0) scale(1);
        }
    }
 
    @keyframes mgToastSlideOut {
        to {
            opacity: 0;
            transform: translateX(120%);
        }
    }
 
    /* ============================================ */
    /* COLOR VARIANTS                                 */
    /* ============================================ */
    .mg-toast-success {
        border-left-color: #4CAF50;
        background: linear-gradient(135deg, #f8fdf8, #ffffff);
    }
    .mg-toast-success .mg-toast-icon {
        background: linear-gradient(135deg, #4CAF50, #2d5016);
        color: #fcf8ef;
    }
    .mg-toast-success .mg-toast-title { color: #2d5016; }
    .mg-toast-success .mg-toast-progress { background: #4CAF50; }
 
    .mg-toast-error {
        border-left-color: #e74c3c;
        background: linear-gradient(135deg, #fef8f7, #ffffff);
    }
    .mg-toast-error .mg-toast-icon {
        background: linear-gradient(135deg, #e74c3c, #c0392b);
        color: white;
    }
    .mg-toast-error .mg-toast-title { color: #c0392b; }
    .mg-toast-error .mg-toast-progress { background: #e74c3c; }
 
    .mg-toast-warning {
        border-left-color: #c5a059;
        background: linear-gradient(135deg, #fffdf5, #ffffff);
    }
    .mg-toast-warning .mg-toast-icon {
        background: linear-gradient(135deg, #c5a059, #d4b374);
        color: #1b3022;
    }
    .mg-toast-warning .mg-toast-title { color: #8a6d2e; }
    .mg-toast-warning .mg-toast-progress { background: #c5a059; }
 
    .mg-toast-info {
        border-left-color: #1b3022;
        background: linear-gradient(135deg, #f8fdf8, #ffffff);
    }
    .mg-toast-info .mg-toast-icon {
        background: linear-gradient(135deg, #1b3022, #2d5016);
        color: #c5a059;
    }
    .mg-toast-info .mg-toast-title { color: #1b3022; }
    .mg-toast-info .mg-toast-progress { background: #2d5016; }
 
    /* Fallback if no tag class — treat as info */
    .mg-toast:not(.mg-toast-success):not(.mg-toast-error):not(.mg-toast-warning):not(.mg-toast-info) {
        border-left-color: #1b3022;
    }
 
    /* ============================================ */
    /* INNER ELEMENTS                                 */
    /* ============================================ */
    .mg-toast-icon {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        font-weight: 800;
        flex-shrink: 0;
    }
 
    .mg-toast-content {
        min-width: 0;  /* allows text truncation if needed */
    }
 
    .mg-toast-title {
        font-size: 0.85rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 0.15rem;
    }
 
    .mg-toast-message {
        color: #333;
        font-size: 0.92rem;
        line-height: 1.45;
        word-wrap: break-word;
    }
 
    .mg-toast-close {
        background: transparent;
        border: none;
        color: #999;
        font-size: 1.5rem;
        line-height: 1;
        cursor: pointer;
        padding: 0;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        flex-shrink: 0;
    }
 
    .mg-toast-close:hover {
        background: rgba(0, 0, 0, 0.05);
        color: #333;
    }
 
    .mg-toast-close:focus {
        outline: 2px solid #c5a059;
        outline-offset: 2px;
    }
 
    /* Progress bar showing time until auto-dismiss */
    .mg-toast-progress {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 3px;
        width: 100%;
        opacity: 0.4;
        transform-origin: left;
        animation: mgToastProgress 5s linear forwards;
    }
 
    @keyframes mgToastProgress {
        from { transform: scaleX(1); }
        to { transform: scaleX(0); }
    }
 
    /* Pause progress when user hovers — give them time to read */
    .mg-toast:hover .mg-toast-progress {
        animation-play-state: paused;
    }
 
    /* ============================================ */
    /* RESPONSIVE                                     */
    /* ============================================ */
    @media (max-width: 600px) {
        .mg-toast-container {
            top: 0.75rem;
            right: 0.75rem;
            left: 0.75rem;
            width: auto;
            max-width: none;
        }
 
        .mg-toast {
            padding: 0.85rem 1rem;
            gap: 0.7rem;
        }
 
        .mg-toast-icon {
            width: 32px;
            height: 32px;
            font-size: 0.9rem;
        }
 
        .mg-toast-title {
            font-size: 0.8rem;
        }
 
        .mg-toast-message {
            font-size: 0.88rem;
        }
    }
 
    /* Respect users who prefer reduced motion */
    @media (prefers-reduced-motion: reduce) {
        .mg-toast,
        .mg-toast-progress {
            animation: none !important;
        }
    }

    .comparison-half {

    .comparison-half.before {

    }
 
    .comparison-img {
        width: 100%;

        background-position: center;

        transition: transform 0.5s ease;

    .comparison-card:hover .comparison-img {

    .comparison-label {

    .comparison-divider-vertical {

        .comparison-card:nth-child(3) {
            grid-column: 1 / -1;

            margin: 0 auto;
            width: 100%;
        }

        .comparison-card:nth-child(3) {
            grid-column: auto;
            max-width: none;
        }
        
        /* Card doesn't need hover lift on mobile */
        .comparison-card:hover {

        /* Slightly wider aspect ratio on mobile for better proportion */

            aspect-ratio: 4 / 3;
